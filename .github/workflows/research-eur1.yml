name: Spirit Tracks EUR1 research checks

on:
  push:
    paths:
      - 'research/eur1/src/**'
      - 'research/eur1/tests/**'
      - 'research/eur1/scripts/**'
      - 'research/eur1/probes/**'
      - 'research/eur1/batches/**'
      - '.github/workflows/research-eur1.yml'
  pull_request:
    paths:
      - 'research/eur1/src/**'
      - 'research/eur1/tests/**'
      - 'research/eur1/scripts/**'
      - 'research/eur1/probes/**'
      - 'research/eur1/batches/**'
      - '.github/workflows/research-eur1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python scripts
        run: |
          python3 -m py_compile research/eur1/scripts/verify_arm9_functions.py
          python3 -m py_compile research/eur1/scripts/analyze_nds.py
      - name: Host behavior tests - ARM9 wrappers
        run: |
          clang -std=c11 -Wall -Wextra -Werror -pedantic             -o /tmp/st-arm9-tests research/eur1/tests/test_recovered_arm9_wrappers.c
          /tmp/st-arm9-tests
      - name: Host behavior tests - Base2
        run: |
          clang -std=c11 -Wall -Wextra -Werror -pedantic             -o /tmp/st-base2-tests research/eur1/tests/test_base2_constructors.c
          /tmp/st-base2-tests
      - name: Syntax and ARM target compilation (NOT CodeWarrior matching)
        run: |
          clang --target=armv5te-none-eabi -march=armv5te -marm             -std=c11 -ffreestanding -Wall -Wextra -Werror             -c research/eur1/src/recovered_base2_constructors.c -o /tmp/st-base2-arm.o

      - name: Verify exact ARM instruction bytes for 0x0201BAE4
        run: python3 research/eur1/scripts/check_matching_leaf.py

      - name: Check 15 ARM9 constant-return functions (ROM-free fingerprints)
        run: python3 research/eur1/scripts/check_constant_leaf_batch.py

      - name: Audit core decompilation boundaries for future native port (ROM-free)
        run: |
          python3 -m unittest discover -s research/eur1/scripts -p 'test_decomp_readiness.py' -v
          python3 research/eur1/scripts/decomp_readiness.py --verify-core --out /tmp/spirit-tracks-decomp-readiness.json

      - name: Test ARM9 boot memory-fill semantics (ROM-free)
        run: |
          clang -std=c11 -Wall -Wextra -Werror -pedantic -o /tmp/st-fill32 research/eur1/tests/test_entry_fill32_semantics.c
          /tmp/st-fill32


      - name: Input and VCOUNT semantic regression tests (ROM-free)
        run: |
          clang -std=c11 -O1 -Wall -Wextra -Werror -pedantic -o /tmp/st-input-semantics research/eur1/tests/test_nds_input_frame_semantics.c
          /tmp/st-input-semantics

      - name: Verify two input ARM9 exact Clang-codegen probes
        run: python3 research/eur1/scripts/verify_arm9_input_exact.py

      - name: Compile 100 overlay0 decompilation functions (ARMv5TE, not CodeWarrior)
        run: |
          clang --target=armv5te-none-eabi -march=armv5te -marm -O2 -ffreestanding -fomit-frame-pointer -ffunction-sections -c research/eur1/batches/ov000_100/overlay000_recovered_100.c -o /tmp/st-ov000-100.o
          python3 -c 'import json; x=json.load(open("research/eur1/batches/ov000_100/manifest_100.json")); assert len(x["functions"]) == 100'

      - name: Compile additional 165 overlay0 C functions (ARMv5TE; no ROM)
        run: |
          clang --target=armv5te-none-eabi -march=armv5te -marm -O2 -ffreestanding -fomit-frame-pointer -ffunction-sections -c research/eur1/batches/ov000_165/overlay000_additional_165.c -o /tmp/st-ov000-extra165.o
          python3 -c 'import json; from pathlib import Path; a=json.loads(Path("research/eur1/batches/ov000_165/manifest_165.json").read_text())["functions"]; b=json.loads(Path("research/eur1/batches/ov000_100/manifest_100.json").read_text())["functions"]; aa=[x["address"] for x in a];bb=[x["address"] for x in b]; assert len(a)==165 and len(set(aa))==165 and not (set(aa)&set(bb))'
